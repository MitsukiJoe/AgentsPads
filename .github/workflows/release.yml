name: Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          version="$(git tag --list | bash .github/scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing AgentsPads v$version"

  build-windows:
    name: Build Windows (x64)
    needs: prepare-version
    runs-on: windows-latest
    env:
      AGENTPAD_VERSION: ${{ needs.prepare-version.outputs.version }}
      AGENTPAD_BUILD_ID: ${{ github.sha }}
      AGENTPAD_CHANNEL: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test desktop application
        run: cargo test --manifest-path desktop/Cargo.toml -p agentpad

      - name: Build Windows executable
        shell: pwsh
        run: |
          cargo build --manifest-path desktop/Cargo.toml -p agentpad --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop\target\x86_64-pc-windows-msvc\release\agentpad.exe agentspads-windows-x64.exe

      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./desktop/installer/sign-windows-artifact.ps1 -Path agentspads-windows-x64.exe

      - name: Prepare installer compiler
        id: installer-compiler
        shell: pwsh
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'agentspads-inno-6.7.4'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') {
            throw 'Inno Setup compiler checksum verification failed.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') {
            throw 'Inno Setup compiler signature verification failed.'
          }
          $compilerProcess = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', ('/DIR="' + $compilerDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($compilerProcess.ExitCode -ne 0) { throw 'Inno Setup compiler preparation failed.' }
          "path=$(Join-Path $compilerDirectory 'ISCC.exe')" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        shell: pwsh
        env:
          INSTALLER_COMPILER: ${{ steps.installer-compiler.outputs.path }}
        run: ./desktop/installer/build-windows-installer.ps1 -Version $env:AGENTPAD_VERSION -Executable agentspads-windows-x64.exe -OutputDirectory . -Compiler $env:INSTALLER_COMPILER

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./desktop/installer/sign-windows-artifact.ps1 -Path agentspads-windows-x64-setup.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact
          path: |
            agentspads-windows-x64-setup.exe
            agentspads-windows-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (ARM64)
    needs: prepare-version
    runs-on: macos-latest
    env:
      AGENTPAD_VERSION: ${{ needs.prepare-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Test desktop application
        run: cargo test --manifest-path desktop/Cargo.toml -p agentpad

      - name: Build macOS application
        shell: bash
        run: |
          cargo build --manifest-path desktop/Cargo.toml -p agentpad --release --target aarch64-apple-darwin
          app="desktop/target/aarch64-apple-darwin/release/AgentsPads.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp desktop/macos/Info.plist "$app/Contents/Info.plist"
          cp desktop/macos/AgentPad.icns "$app/Contents/Resources/AgentPad.icns"
          cp desktop/target/aarch64-apple-darwin/release/agentpad "$app/Contents/MacOS/agentpad"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $AGENTPAD_VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"

      - name: Import macOS signing certificate
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$MACOS_CERTIFICATE_IDENTITY" ]; then
            echo "macOS signing secrets not configured; using ad-hoc signature"
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/agentpad-signing.p12"
          trap 'rm -f "$certificate_path"' EXIT
          umask 077
          keychain_path="$RUNNER_TEMP/agentpad-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$MACOS_CERTIFICATE_IDENTITY"
          security find-certificate -c "$identity" "$keychain_path" >/dev/null
          developer_id=false
          if [[ "$identity" == "Developer ID Application:"* ]]; then
            developer_id=true
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "developer_id=$developer_id" >> "$GITHUB_OUTPUT"

      - name: Sign and package macOS application
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          DEVELOPER_ID: ${{ steps.signing.outputs.developer_id }}
        run: |
          app="desktop/target/aarch64-apple-darwin/release/AgentsPads.app"
          if [ -n "$SIGNING_IDENTITY" ]; then
            if [ "$DEVELOPER_ID" = "true" ]; then
              codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app"
            else
              echo "Using stable self-signed identity for Accessibility continuity"
              codesign --force --deep --sign "$SIGNING_IDENTITY" --identifier app.agentspads "$app"
            fi
          else
            echo "macOS signing secret not configured; using ad-hoc signature"
            codesign --force --deep --sign - --identifier app.agentspads "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" agentspads-macos-arm64.zip
          hdiutil create -volname "AgentsPads" -srcfolder "$app" -ov -format UDZO agentspads-macos-arm64.dmg
          if [ "$DEVELOPER_ID" = "true" ]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" agentspads-macos-arm64.dmg
          fi

      - name: Notarize and package macOS artifacts
        if: ${{ steps.signing.outputs.developer_id == 'true' }}
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ] || [ -z "$APPLE_API_PRIVATE_KEY_BASE64" ]; then
            echo "Apple notarization secrets not configured; skipping notarization"
            exit 0
          fi
          app="desktop/target/aarch64-apple-darwin/release/AgentsPads.app"
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$key_path"' EXIT
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | openssl base64 -d -A -out "$key_path"
          xcrun notarytool submit agentspads-macos-arm64.zip \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app"
          rm agentspads-macos-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" agentspads-macos-arm64.zip
          hdiutil create -volname "AgentsPads" -srcfolder "$app" -ov -format UDZO agentspads-macos-arm64.dmg
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" agentspads-macos-arm64.dmg
          xcrun notarytool submit agentspads-macos-arm64.dmg \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple agentspads-macos-arm64.dmg
          xcrun stapler validate "$app"
          xcrun stapler validate agentspads-macos-arm64.dmg

      - name: Remove macOS signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/agentpad-signing.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifact
          path: |
            agentspads-macos-arm64.dmg
            agentspads-macos-arm64.zip
          if-no-files-found: error

  build-android:
    name: Build Android (APK)
    needs: prepare-version
    runs-on: ubuntu-latest
    env:
      AGENTPAD_VERSION: ${{ needs.prepare-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test Android application
        working-directory: android
        run: |
          flutter pub get
          flutter test

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets not configured; using debug key"
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android/app/agentpad-release.jks
          printf '%s\n' \
            "storeFile=agentpad-release.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/android/key.properties

      - name: Build Android APK
        working-directory: android
        run: |
          flutter build apk --release \
            --build-name="$AGENTPAD_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=AGENTPAD_VERSION="$AGENTPAD_VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk ../agentspads.apk

      - name: Remove Android signing files
        if: ${{ always() }}
        shell: bash
        run: rm -f android/android/app/agentpad-release.jks android/android/key.properties

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-artifact
          path: agentspads.apk
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - prepare-version
      - build-windows
      - build-macos
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          test -s agentspads-windows-x64.exe
          test -s agentspads-windows-x64-setup.exe
          test -s agentspads-macos-arm64.dmg
          test -s agentspads-macos-arm64.zip
          test -s agentspads.apk
          sha256sum agentspads-windows-x64-setup.exe agentspads-windows-x64.exe agentspads-macos-arm64.dmg agentspads-macos-arm64.zip agentspads.apk

      - name: Create update manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > release-notes.md
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          windows_sha="$(sha256sum agentspads-windows-x64.exe | awk '{print $1}')"
          macos_sha="$(sha256sum agentspads-macos-arm64.zip | awk '{print $1}')"
          android_sha="$(sha256sum agentspads.apk | awk '{print $1}')"
          BASE_URL="$base_url" python3 -c 'import os; from pathlib import Path; base=os.environ["BASE_URL"]; badge=lambda alt, url, src: f"<a href=\"{url}\"><img alt=\"{alt}\" src=\"{src}\"></a>"; rows=("Windows", badge("Windows 安装包 x64", f"{base}/agentspads-windows-x64-setup.exe", "https://img.shields.io/badge/Setup-x64-2d7d9a.svg?logo=windows&logoColor=white"), "macOS", badge("macOS DMG Apple Silicon", f"{base}/agentspads-macos-arm64.dmg", "https://img.shields.io/badge/DMG-Apple%20Silicon-000000.svg?logo=apple&logoColor=white"), "Android", badge("Android APK", f"{base}/agentspads.apk", "https://img.shields.io/badge/APK-Android-168039.svg?logo=android&logoColor=white")); body=["<a href=\"https://qm.qq.com/q/oL9E21pt7k\"><img alt=\"QQ群\" src=\"https://img.shields.io/badge/QQ%E7%BE%A4-%E7%82%B9%E6%AD%A4%E5%8A%A0%E5%85%A5-2da44e.svg?logo=qq&logoColor=white\"></a> <a href=\"https://t.me/Neko0CM\"><img alt=\"TG群\" src=\"https://img.shields.io/badge/TG%E7%BE%A4-%E7%82%B9%E6%AD%A4%E5%8A%A0%E5%85%A5-26A5E4.svg?logo=telegram&logoColor=white\"></a>", "", "**按系统下载：**", "", "<div align=\"left\">", "<table>", "<thead align=\"left\"><tr><th>系统</th><th>下载</th></tr></thead>", "<tbody align=\"left\">"];
          [body.append(f"<tr><td>{rows[i]}</td><td>{rows[i+1]}</td></tr>") for i in range(0, len(rows), 2)]; body += ["</tbody>", "</table>", "</div>", ""]; Path("release-body.md").write_text("\n".join(body) + Path("release-notes.md").read_text())'
          jq -n \
            --arg tag_name "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg release_url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --arg windows_url "$base_url/agentspads-windows-x64.exe" \
            --arg windows_sha "$windows_sha" \
            --arg macos_url "$base_url/agentspads-macos-arm64.zip" \
            --arg macos_sha "$macos_sha" \
            --arg android_url "$base_url/agentspads.apk" \
            --arg android_sha "$android_sha" \
            --rawfile body release-notes.md \
            '{
              schema: 1,
              tag_name: $tag_name,
              version: $version,
              release_url: $release_url,
              body: $body,
              assets: {
                windows: {name: "agentspads-windows-x64.exe", url: $windows_url, sha256: $windows_sha},
                macos: {name: "agentspads-macos-arm64.zip", url: $macos_url, sha256: $macos_sha},
                android: {name: "agentspads.apk", url: $android_url, sha256: $android_sha}
              }
            }' > agentspads-update.json
          jq -e '.schema == 1 and (.version | length > 0) and (.assets.windows.sha256 | length == 64) and (.assets.macos.sha256 | length == 64) and (.assets.android.sha256 | length == 64)' agentspads-update.json >/dev/null

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: AgentsPads ${{ needs.prepare-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            agentspads-windows-x64-setup.exe
            agentspads-windows-x64.exe
            agentspads-macos-arm64.dmg
            agentspads-macos-arm64.zip
            agentspads.apk
            agentspads-update.json

      - name: Publish update manifest branch
        continue-on-error: true
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan update-manifest-publish
          git rm -rf .
          git add -f agentspads-update.json
          git commit -m "chore: publish update manifest for $RELEASE_TAG"
          git push --force origin HEAD:update-manifest

      - name: Refresh update CDN caches
        continue-on-error: true
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          path="gh/$GITHUB_REPOSITORY@update-manifest/agentspads-update.json"
          curl --fail --silent --show-error --retry 2 "https://purge.jsdelivr.net/$path" >/dev/null
          curl --fail --silent --show-error --retry 2 \
            "https://cdn.jsdmirror.com/$path?release=$RELEASE_TAG" \
            | jq -e --arg version "$RELEASE_VERSION" '.version == $version' >/dev/null
